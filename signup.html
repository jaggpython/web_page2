<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join ShopEasy and start shopping smarter</p>

    <form onsubmit="signupUser(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-box">
          <input type="password" id="password" placeholder="Create password" required>
          <span onclick="togglePassword('password')">👁</span>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="password-box">
          <input type="password" id="confirm-password" placeholder="Confirm password" required>
          <span onclick="togglePassword('confirm-password')">👁</span>
        </div>
      </div>

      <button type="submit" class="auth-btn">Sign Up</button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </div>

<script src="auth.js"></script>
</body>
</html>
